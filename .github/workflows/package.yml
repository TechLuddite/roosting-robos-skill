name: package

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-tags: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      # Fails the build if the committed manifest is missing, unparseable, or
      # carries real values or secret-shaped strings. The shipped starter is
      # UNCONFIGURED by design; --allow-unconfigured downgrades that one error
      # to a warning, so warnings (exit 1) pass and everything else fails
      # closed on the exit code.
      - name: Check the committed manifest for leaked values
        run: |
          python skills/rewst/scripts/validate_manifest.py --allow-unconfigured \
            skills/rewst/references/tenant-manifest.json || [ $? -eq 1 ]

      - name: Package the skill
        run: python scripts/package.py skills/rewst dist

      # The layout claude.ai uploads expect — rewst/SKILL.md at the archive
      # root — and a packed manifest that still passes the leak check.
      - name: Smoke-test the package
        run: |
          python -m zipfile -t dist/rewst.skill
          unzip -q dist/rewst.skill -d "$RUNNER_TEMP/skill-smoke"
          test -f "$RUNNER_TEMP/skill-smoke/rewst/SKILL.md"
          python skills/rewst/scripts/validate_manifest.py --allow-unconfigured \
            "$RUNNER_TEMP/skill-smoke/rewst/references/tenant-manifest.json" || [ $? -eq 1 ]

      # A green build on main is easy to mistake for a published release; the
      # release job only runs on a v* tag, so say so when the tag is missing.
      - name: Remind when the plugin version has no tag
        if: github.ref == 'refs/heads/main'
        run: |
          v=$(python -c "import json; print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          if [ -z "$(git tag -l "v$v")" ]; then
            echo "::notice title=No release for $v::plugin.json is at $v but no v$v tag exists, so no GitHub Release carries rewst.skill. Cut one with: git tag v$v && git push origin v$v"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rewst-skill
          path: dist/rewst.skill

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Checkout is only for reading plugin.json; the shipped bytes come from
      # the build job's artifact, so the release asset is exactly what the
      # leak check and smoke test passed.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check the tag matches plugin.json
        run: |
          v=$(python3 -c "import json; print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          if [ "v$v" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match plugin.json version $v — bump .claude-plugin/plugin.json, commit, then retag"
            exit 1
          fi

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rewst-skill
          path: dist

      # Creates the release if the tag was pushed before one existed, otherwise
      # attaches to the release that's already there.
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/rewst.skill --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/rewst.skill \
              --title "${GITHUB_REF_NAME}" --generate-notes
          fi
