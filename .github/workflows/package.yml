name: package

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # No fetch-tags here: checking out a tag ref with fetch-tags enabled
      # trips "Cannot fetch both <sha> and refs/tags/<tag>" in actions/checkout,
      # failing every tag build. The reminder step asks the remote instead.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      # Fails the build if the committed manifest is missing, unparseable, or
      # carries value fields or credential-shaped strings (known prefixes,
      # URL-embedded passwords, key=value assignments, webhook URLs, long hex).
      # The shipped starter is UNCONFIGURED by design; --allow-unconfigured
      # downgrades that one error to a warning, so warnings (exit 1) pass and
      # everything else fails closed on the exit code. House style gets a
      # webhook-URL grep too — a webhook URL is a capability-bearing secret.
      - name: Check the committed manifest and house style for leaked values
        run: |
          python skills/rewst/scripts/validate_manifest.py --allow-unconfigured \
            skills/rewst/references/tenant-manifest.json || [ $? -eq 1 ]
          ! grep -nE '(hooks\.slack\.com/|webhook\.office\.com/|outlook\.office\.com/webhook|discord(app)?\.com/api/webhooks)' \
            skills/rewst/references/house-style.md

      - name: Package the skill
        run: python scripts/package.py skills/rewst dist

      # The checksum crosses the job boundary with the artifact, so the
      # release job can prove it attaches the exact bytes this job checked —
      # and it ships next to the asset so downloads can be verified.
      - name: Checksum the artifact
        run: sha256sum dist/rewst.skill | tee dist/rewst.skill.sha256

      # The layout claude.ai uploads expect — rewst/SKILL.md at the archive
      # root — and a packed manifest that still passes the leak check.
      - name: Smoke-test the package
        run: |
          python -m zipfile -t dist/rewst.skill
          unzip -q dist/rewst.skill -d "$RUNNER_TEMP/skill-smoke"
          test -f "$RUNNER_TEMP/skill-smoke/rewst/SKILL.md"
          python skills/rewst/scripts/validate_manifest.py --allow-unconfigured \
            "$RUNNER_TEMP/skill-smoke/rewst/references/tenant-manifest.json" || [ $? -eq 1 ]

      # A green build on main is easy to mistake for a published release; the
      # release job only runs on a v* tag, so say so when the tag is missing.
      - name: Remind when the plugin version has no tag
        if: github.ref == 'refs/heads/main'
        run: |
          v=$(python -c "import json; print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          if ! git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null 2>&1; then
            echo "::notice title=No release for $v::plugin.json is at $v but no v$v tag exists, so no GitHub Release carries rewst.skill. Cut one with: git tag v$v && git push origin v$v"
          fi

      # The release job only runs for v* tags; a release published on a bare
      # "0.1.0"-style tag would otherwise sit assetless with no explanation.
      - name: Warn when a published release is not on a v tag
        if: github.event_name == 'release' && !startsWith(github.ref, 'refs/tags/v')
        run: echo "::warning title=No asset will be attached::this release's tag does not start with v, so the release job is skipped and no rewst.skill is attached — retag as v<version> matching plugin.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rewst-skill
          path: |
            dist/rewst.skill
            dist/rewst.skill.sha256

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A hook for repo settings: add required reviewers or tag rules to the
    # "release" environment to gate publication. With none configured it
    # behaves exactly as before.
    environment: release
    permissions:
      contents: write
    steps:
      # Checkout is only for reading plugin.json; the shipped bytes come from
      # the build job's artifact, so the release asset is exactly what the
      # leak check and smoke test passed. persist-credentials off: nothing
      # here uses git after checkout, so don't leave a contents:write token
      # behind in .git/config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag matches plugin.json
        run: |
          v=$(python3 -c "import json; print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          if [ "v$v" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match plugin.json version $v — bump .claude-plugin/plugin.json, commit, then retag"
            exit 1
          fi

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rewst-skill
          path: dist

      - name: Verify the artifact against the build job's checksum
        run: sha256sum -c dist/rewst.skill.sha256

      # Creates the release if the tag was pushed before one existed, otherwise
      # attaches to the release that's already there. The .sha256 ships too so
      # a download can be verified against what the build job checked.
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/rewst.skill dist/rewst.skill.sha256 --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/rewst.skill dist/rewst.skill.sha256 \
              --title "${GITHUB_REF_NAME}" --generate-notes
          fi
